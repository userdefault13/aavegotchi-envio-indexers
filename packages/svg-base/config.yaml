# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: aavegotchi-svg-base
description: Aavegotchi SVG indexer for Base (port of aavegotchi-svg-subgraph)
contracts:
  - name: AavegotchiDiamond
    abi_file_path: ./abis/AavegotchiDiamond.json
    handler: ./src/EventHandlers.ts
    events:
      - event: ClaimAavegotchi
      - event: EquipWearables
      # Transfer: topic-filtered to bridge vault _from only (not all diamond ERC721 transfers)
      - event: Transfer
networks:
  - id: 8453
    start_block: 33201946
    # HyperSync primary; RPC fallbacks after ~15s stall
    rpc:
      - url: https://mainnet.base.org
        for: fallback
        fallback_stall_timeout: 15000
        query_timeout_millis: 20000
      - url: https://base-rpc.publicnode.com
        for: fallback
        fallback_stall_timeout: 15000
        query_timeout_millis: 20000
    contracts:
      - name: AavegotchiDiamond
        address: "0xA99c4B08201F2913Db8D28e71d020c4298F29dBF"
unordered_multichain_mode: false
field_selection:
  transaction_fields:
    - hash
    - from
    - to
    - value
