# ItemsRolesRegistry

type RolesRegistry {
  id: ID! # contractAddress
  roles: [Role!]! @derivedFrom(field: "rolesRegistry")
}

type Role {
  id: ID! # rolesRegistryAddress + depositId + roleHash
  rolesRegistry: RolesRegistry!
  roleHash: Bytes!
  tokenAddress: String!
  tokenId: BigInt!
  tokenCommitment: TokenCommitment
  roleAssignments: [RoleAssignment!]! @derivedFrom(field: "role")
}

type RoleAssignment {
  id: ID! # rolesRegistryAddress + depositId + granteeAddress + roleHash
  role: Role!
  tokenAddress: String!
  tokenId: BigInt!
  grantor: User!
  grantee: User!
  expirationDate: BigInt!
  revocable: Boolean!
  data: Bytes!
  createdAt: BigInt!
  updatedAt: BigInt!
  tokenCommitment: TokenCommitment
}

type TokenCommitment {
  id: ID! # rolesRegistryAddress + depositId
  rolesRegistry: RolesRegistry!
  depositId: BigInt!
  grantor: User!
  tokenAddress: String!
  tokenId: BigInt!
  amount: BigInt!
  isReleased: Boolean!
  usedBalance: BigInt!
  roleAssignments: [RoleAssignment!]! @derivedFrom(field: "tokenCommitment")
}

type ItemTypeOwnership {
  id: ID! # Format: itemTypeId-ownerAddress
