# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: aavegotchi-alchemica-base
description: Gotchus Alchemica ERC-20 balances on Base (port of aavegotchi-alchemica-subgraph)
contracts:
  - name: AlchemicaFud
    abi_file_path: ./abis/ERC20.json
    handler: ./src/handlers/alchemica.ts
    events:
      - event: Transfer
  - name: AlchemicaFomo
    abi_file_path: ./abis/ERC20.json
    handler: ./src/handlers/alchemica.ts
    events:
      - event: Transfer
  - name: AlchemicaAlpha
    abi_file_path: ./abis/ERC20.json
    handler: ./src/handlers/alchemica.ts
    events:
      - event: Transfer
  - name: AlchemicaKek
    abi_file_path: ./abis/ERC20.json
    handler: ./src/handlers/alchemica.ts
    events:
      - event: Transfer
  - name: AlchemicaGltr
    abi_file_path: ./abis/ERC20.json
    handler: ./src/handlers/alchemica.ts
    events:
      - event: Transfer
  - name: AlchemicaGhst
    abi_file_path: ./abis/ERC20.json
    handler: ./src/handlers/alchemica.ts
    events:
      - event: Transfer
networks:
  - id: 8453
    start_block: 33201946
    # HyperSync primary; RPC fallbacks after ~15s stall
    rpc:
      - url: https://mainnet.base.org
        for: fallback
        fallback_stall_timeout: 15000
        query_timeout_millis: 20000
