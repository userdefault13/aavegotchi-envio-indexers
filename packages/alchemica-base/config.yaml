      - name: AlchemicaKek
        address: "0xE52b9170fF4ece4C35E796Ffd74B57Dec68Ca0e5"
      - name: AlchemicaGltr
        address: "0x4D140CE792bEdc430498c2d219AfBC33e2992c9D"
      - name: AlchemicaGhst
        address: "0xcd2f22236dd9dfe2356d7c543161d4d260fd9bcb"
unordered_multichain_mode: false
