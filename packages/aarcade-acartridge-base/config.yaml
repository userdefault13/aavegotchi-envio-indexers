# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: aarcade-acartridge-base
description: Aarcade aCartridge (Agent as Player) diamond indexer — agents, controllers, game reps, attested checkpoints (Base Sepolia / Base mainnet)
contracts:
  - name: ACartridgeDiamond
    abi_file_path: ./abis/ACartridgeDiamond.json
    handler: ./src/EventHandlers.ts
    events:
      - event: ACartridgeMinted
      - event: Transfer
      - event: ControllerSet
      - event: ControllerRevoked
      - event: ControllersCleared
      - event: GameEntered
      - event: CheckpointAttested
      - event: ReputationUpdated
      - event: WorldUpdated
      - event: AttestorSet
networks:
  - id: 84532
    start_block: 46953163
    rpc:
      - url: https://sepolia.base.org
        for: fallback
    contracts:
      - name: ACartridgeDiamond
        address: "0x8fB6DD5Cef4521E01cCAb178B84eE1392CdB1232"
  # Base mainnet: fill in after the mainnet deploy (docs/ACARTRIDGE_DIAMOND_PLAN.md phase 4).
unordered_multichain_mode: true
field_selection:
  transaction_fields:
    - hash
    - from
