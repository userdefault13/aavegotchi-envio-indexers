# Single-server production stack (Hetzner, DigitalOcean, OVH, etc.)
# Usage: docker compose -f docker/production/docker-compose.yaml --env-file .env up -d --build

name: aavegotchi-indexers

services:
  core-postgres:
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENVIO_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${ENVIO_PG_PASSWORD:?set ENVIO_PG_PASSWORD}
      POSTGRES_DB: ${CORE_PG_DATABASE:-envio-core}
    volumes:
      - core-indexer-storage:/var/lib/postgresql/data
    networks:
      - indexer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENVIO_PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-hasura:
    image: hasura/graphql-engine:v2.43.0
    restart: unless-stopped
    depends_on:
      core-postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${ENVIO_PG_USER:-postgres}:${ENVIO_PG_PASSWORD}@core-postgres:5432/${CORE_PG_DATABASE:-envio-core}
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-false}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?set HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
    healthcheck:
      test: timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 5s
      timeout: 2s
      retries: 50
      start_period: 10s
    networks:
      - indexer-net

  core-indexer:
    build:
      context: ../..
      dockerfile: packages/core-base/Dockerfile
      args:
        ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:?set ENVIO_API_TOKEN}
    restart: unless-stopped
    depends_on:
      core-hasura:
        condition: service_healthy
    environment:
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN}
      ENVIO_PG_PASSWORD: ${ENVIO_PG_PASSWORD}
      ENVIO_PG_HOST: core-postgres
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: ${ENVIO_PG_USER:-postgres}
      ENVIO_PG_DATABASE: ${CORE_PG_DATABASE:-envio-core}
      ENVIO_PG_PUBLIC_SCHEMA: ${ENVIO_PG_PUBLIC_SCHEMA:-envio}
      ENVIO_INDEXER_HOST: 0.0.0.0
      ENVIO_INDEXER_PORT: 9898
      CONFIG_FILE: config.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TUI_OFF: "true"
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      BASE_MAINNET_RPC: ${BASE_MAINNET_RPC:-}
      HASURA_GRAPHQL_ENDPOINT: http://core-hasura:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_SERVICE_HOST: core-hasura
      HASURA_SERVICE_PORT: 8080
    networks:
      - indexer-net

  gv-postgres:
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENVIO_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${ENVIO_PG_PASSWORD}
      POSTGRES_DB: ${GV_PG_DATABASE:-envio-gv}
    volumes:
      - gv-indexer-storage:/var/lib/postgresql/data
    networks:
      - indexer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENVIO_PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  gv-hasura:
    image: hasura/graphql-engine:v2.43.0
    restart: unless-stopped
    depends_on:
      gv-postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${ENVIO_PG_USER:-postgres}:${ENVIO_PG_PASSWORD}@gv-postgres:5432/${GV_PG_DATABASE:-envio-gv}
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-false}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
    healthcheck:
      test: timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 5s
      timeout: 2s
      retries: 50
      start_period: 10s
    networks:
      - indexer-net

  gv-indexer:
    build:
      context: ../..
      dockerfile: packages/gotchiverse-base/Dockerfile
      args:
        ENVIO_API_TOKEN: ${ENVIO_API_TOKEN}
    restart: unless-stopped
    depends_on:
      gv-hasura:
        condition: service_healthy
    environment:
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN}
      ENVIO_PG_PASSWORD: ${ENVIO_PG_PASSWORD}
      ENVIO_PG_HOST: gv-postgres
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: ${ENVIO_PG_USER:-postgres}
      ENVIO_PG_DATABASE: ${GV_PG_DATABASE:-envio-gv}
      ENVIO_PG_PUBLIC_SCHEMA: ${ENVIO_PG_PUBLIC_SCHEMA:-envio}
      ENVIO_INDEXER_HOST: 0.0.0.0
      ENVIO_INDEXER_PORT: 9899
      CONFIG_FILE: config.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TUI_OFF: "true"
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      BASE_MAINNET_RPC: ${BASE_MAINNET_RPC:-}
      HASURA_GRAPHQL_ENDPOINT: http://gv-hasura:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_SERVICE_HOST: gv-hasura
      HASURA_SERVICE_PORT: 8080
    networks:
      - indexer-net

  graphql-proxy:
    build:
      context: ../../services/graphql-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - core-hasura
      - gv-hasura
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8787}:8787"
    environment:
      PROXY_PORT: 8787
      CORE_HASURA_URL: http://core-hasura:8080/v1/graphql
      GV_HASURA_URL: http://gv-hasura:8080/v1/graphql
      HASURA_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
    networks:
      - indexer-net

volumes:
  core-indexer-storage:
  gv-indexer-storage:

networks:
  indexer-net:
    driver: bridge
