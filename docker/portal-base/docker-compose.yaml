services:
  envio-postgres:
    image: postgres:17.5
    restart: always
    ports:
      - "${PORTAL_PG_PORT:-5438}:5432"
    volumes:
      - portal-indexer-storage:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${ENVIO_PG_PASSWORD:-testing}
      POSTGRES_USER: ${ENVIO_PG_USER:-postgres}
      POSTGRES_DB: ${PORTAL_PG_DATABASE:-envio-portal}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENVIO_PG_USER:-postgres} -d ${PORTAL_PG_DATABASE:-envio-portal}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - portal-indexer-network

  graphql-engine:
    image: hasura/graphql-engine:v2.43.0
    ports:
      - "${PORTAL_HASURA_PORT:-8085}:8080"
    depends_on:
      envio-postgres:
        condition: service_healthy
    restart: always
    environment:
      # Set PORTAL_HASURA_DATABASE_URL in .env if ENVIO_PG_PASSWORD contains / @ # etc.
      HASURA_GRAPHQL_DATABASE_URL: ${PORTAL_HASURA_DATABASE_URL:-postgres://${ENVIO_PG_USER:-postgres}:${ENVIO_PG_PASSWORD:-testing}@envio-postgres:5432/${PORTAL_PG_DATABASE:-envio-portal}}
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-true}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
    healthcheck:
      test: timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 5s
      timeout: 2s
      retries: 50
      start_period: 10s
    networks:
      - portal-indexer-network

  envio-indexer:
    build:
      context: ../..
      dockerfile: packages/portal-base/Dockerfile
      args:
        ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-development}
    depends_on:
      graphql-engine:
        condition: service_healthy
    restart: always
    environment:
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-development}
      ENVIO_PG_PASSWORD: ${ENVIO_PG_PASSWORD:-testing}
      ENVIO_PG_HOST: envio-postgres
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: ${ENVIO_PG_USER:-postgres}
      ENVIO_PG_DATABASE: ${PORTAL_PG_DATABASE:-envio-portal}
      ENVIO_PG_PUBLIC_SCHEMA: ${ENVIO_PG_PUBLIC_SCHEMA:-envio}
      ENVIO_INDEXER_HOST: 0.0.0.0
      ENVIO_INDEXER_PORT: ${PORTAL_INDEXER_PORT:-9896}
      CONFIG_FILE: config.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TUI_OFF: ${TUI_OFF:-true}
      ENVIO_TUI: "false"
      BASE_MAINNET_RPC: ${BASE_MAINNET_RPC:-}
      # Transfer topic filters (portal-transfer-token-ids.json). Set PORTAL_INDEX_TRANSFER=0 to disable.
      PORTAL_INDEX_TRANSFER: ${PORTAL_INDEX_TRANSFER:-1}
      PORTAL_TRANSFER_TOKEN_IDS: ${PORTAL_TRANSFER_TOKEN_IDS:-}
      PORTAL_TRANSFER_TOKEN_ID_MIN: ${PORTAL_TRANSFER_TOKEN_ID_MIN:-}
      PORTAL_TRANSFER_TOKEN_ID_MAX: ${PORTAL_TRANSFER_TOKEN_ID_MAX:-}
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
      HASURA_SERVICE_HOST: graphql-engine
      HASURA_SERVICE_PORT: 8080
    networks:
      - portal-indexer-network

volumes:
  portal-indexer-storage:

networks:
  portal-indexer-network:
