# Aavegotchi H1 (Avalanche Fuji 43113) Baazaar market indexer. NOT started by default:
# run explicitly with  npm run docker:avax-h1  (see packages/avax-h1-market/README.md).
services:
  envio-postgres:
    image: postgres:17.5
    restart: always
    ports:
      - "${AVAX_H1_PG_PORT:-5444}:5432"
    volumes:
      - avax-h1-indexer-storage:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${ENVIO_PG_PASSWORD:-testing}
      POSTGRES_USER: ${ENVIO_PG_USER:-postgres}
      POSTGRES_DB: ${AVAX_H1_PG_DATABASE:-envio-avax-h1}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENVIO_PG_USER:-postgres} -d ${AVAX_H1_PG_DATABASE:-envio-avax-h1}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - avax-h1-indexer-network

  graphql-engine:
    image: hasura/graphql-engine:v2.43.0
    ports:
      - "${AVAX_H1_HASURA_PORT:-8091}:8080"
    depends_on:
      envio-postgres:
        condition: service_healthy
    restart: always
    environment:
      # Set AVAX_H1_HASURA_DATABASE_URL in .env if ENVIO_PG_PASSWORD contains / @ # etc.
      HASURA_GRAPHQL_DATABASE_URL: ${AVAX_H1_HASURA_DATABASE_URL:-postgres://${ENVIO_PG_USER:-postgres}:${ENVIO_PG_PASSWORD:-testing}@envio-postgres:5432/${AVAX_H1_PG_DATABASE:-envio-avax-h1}}
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-true}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
    healthcheck:
      test: timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 5s
      timeout: 2s
      retries: 50
      start_period: 10s
    networks:
      - avax-h1-indexer-network

  envio-indexer:
    build:
      context: ../..
      dockerfile: packages/avax-h1-market/Dockerfile
    depends_on:
      graphql-engine:
        condition: service_healthy
    restart: always
    environment:
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-development}
      ENVIO_PG_PASSWORD: ${ENVIO_PG_PASSWORD:-testing}
      ENVIO_PG_HOST: envio-postgres
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: ${ENVIO_PG_USER:-postgres}
      ENVIO_PG_DATABASE: ${AVAX_H1_PG_DATABASE:-envio-avax-h1}
      ENVIO_PG_PUBLIC_SCHEMA: ${ENVIO_PG_PUBLIC_SCHEMA:-envio}
      ENVIO_INDEXER_HOST: 0.0.0.0
      ENVIO_INDEXER_PORT: ${AVAX_H1_INDEXER_PORT:-9901}
      CONFIG_FILE: config.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TUI_OFF: ${TUI_OFF:-true}
      ENVIO_TUI: "false"
      # Optional: point HyperSync at a local throttle/proxy, e.g. http://host.docker.internal:8797
      HYPERSYNC_URL_43113: ${HYPERSYNC_URL_43113:-}
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
      HASURA_SERVICE_HOST: graphql-engine
      HASURA_SERVICE_PORT: 8080
    networks:
      - avax-h1-indexer-network

volumes:
  avax-h1-indexer-storage:

networks:
  avax-h1-indexer-network:
