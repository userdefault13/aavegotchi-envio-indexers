services:
  graphql-proxy:
    build:
      context: ../../services/graphql-proxy
      dockerfile: Dockerfile
    ports:
      - "${PROXY_PORT:-8787}:8787"
    environment:
      PROXY_PORT: 8787
      CORE_HASURA_URL: ${CORE_HASURA_URL:-http://host.docker.internal:8080/v1/graphql}
      GV_HASURA_URL: ${GV_HASURA_URL:-http://host.docker.internal:8081/v1/graphql}
      HASURA_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
